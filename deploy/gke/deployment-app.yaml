apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-app
  namespace: historical-ocr
  labels:
    app: ocr-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocr-app
  template:
    metadata:
      labels:
        app: ocr-app
    spec:
      containers:
        - name: app
          image: europe-west1-docker.pkg.dev/PROJECT_ID/ocr-repo/historical-ocr-app:IMAGE_TAG
          imagePullPolicy: Always
          workingDir: /app
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: ocr-app-config
          env:
            - name: DATA_DIR
              value: /app/data
          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: app-data
              mountPath: /app/app/vital_records_index
          resources:
            requests:
              memory: "2Gi"
              cpu: "800m"
            limits:
              memory: "5Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: ocr-app-pvc
